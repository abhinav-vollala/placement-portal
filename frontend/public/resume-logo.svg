<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Soft background glow gradient -->
    <radialGradient id="cvBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F8E2" stop-opacity="1" />
      <stop offset="70%" stop-color="#E1F5DA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D4F0CB" stop-opacity="0.5" />
    </radialGradient>

    <!-- Folder green gradient -->
    <linearGradient id="cvFolderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80C938" />
      <stop offset="50%" stop-color="#67B928" />
      <stop offset="100%" stop-color="#4AA31F" />
    </linearGradient>

    <!-- Folder back flap darker shade -->
    <linearGradient id="cvBackFlapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#46931E" />
      <stop offset="100%" stop-color="#367C15" />
    </linearGradient>

    <!-- Document shadow -->
    <filter id="cvDocShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.08" />
    </filter>

    <!-- Folder shadow -->
    <filter id="cvFolderShadow" x="-10%" y="-5%" width="125%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#1E4D0F" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Circular background backdrop -->
  <circle cx="50" cy="50" r="46" fill="url(#cvBgGlow)" />

  <!-- Back document (offset slightly) -->
  <g filter="url(#cvDocShadow)">
    <rect x="29" y="15" width="40" height="42" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" transform="rotate(-3 49 36)" />
  </g>

  <!-- Front document -->
  <g filter="url(#cvDocShadow)">
    <rect x="31" y="16" width="40" height="45" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

    <!-- Avatar Box -->
    <rect x="34.5" y="19.5" width="12" height="14" rx="1.5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.6" />
    
    <!-- Avatar Hair -->
    <path d="M 37.5 24 C 37.5 21.8 39 21 40.5 21 C 42 21 43.5 21.8 43.5 24 C 43 24.3 43.2 25 43.5 25.5 C 42.5 25.5 42 24.8 40.5 24.8 C 39.2 24.8 38.8 25.5 38 25.5 C 38 25 37.5 24.3 37.5 24 Z" fill="#6D3B1E" />
    <!-- Avatar Head / Neck -->
    <circle cx="40.5" cy="24.5" r="2.6" fill="#FDBA8C" />
    <!-- Avatar Suit Jacket -->
    <path d="M 35 33.5 C 35 29.8 37.2 28.5 40.5 28.5 C 43.8 28.5 46 29.8 46 33.5 Z" fill="#2D3748" />
    <!-- Avatar Shirt Collar -->
    <polygon points="39.2,28.5 41.8,28.5 40.5,31" fill="#FFFFFF" />
    <!-- Avatar Tie -->
    <polygon points="40,29.8 41,29.8 41.3,33.5 40.5,34 39.7,33.5" fill="#0284C7" />

    <!-- Multi-colored Text Lines on right of avatar -->
    <rect x="49" y="20.5" width="18" height="1.8" rx="0.9" fill="#4F46E5" fill-opacity="0.85" />
    <rect x="49" y="24" width="14" height="1.6" rx="0.8" fill="#0EA5E9" fill-opacity="0.85" />
    <rect x="49" y="27.5" width="11" height="1.6" rx="0.8" fill="#10B981" fill-opacity="0.85" />
    <rect x="49" y="31" width="16" height="1.6" rx="0.8" fill="#F59E0B" fill-opacity="0.85" />

    <!-- Multi-colored Lower Text Lines -->
    <rect x="34.5" y="36.5" width="33" height="1.6" rx="0.8" fill="#6366F1" fill-opacity="0.8" />
    <rect x="34.5" y="40" width="28" height="1.6" rx="0.8" fill="#0D9488" fill-opacity="0.8" />
    <rect x="34.5" y="43.5" width="31" height="1.6" rx="0.8" fill="#EC4899" fill-opacity="0.75" />
  </g>

  <!-- Folder Back Flap -->
  <path d="M 26 43 C 26 41 27.5 39.5 29.5 39.5 L 43 39.5 C 44.5 39.5 46 40.5 47 42 L 48.5 44 L 71.5 44 C 73 44 74 45 74 46.5 L 74 54 L 26 54 Z" fill="url(#cvBackFlapGrad)" />

  <!-- Folder Front Body -->
  <g filter="url(#cvFolderShadow)">
    <path d="M 26 49 C 26 47 27.5 45.5 29.5 45.5 L 41.5 45.5 C 43.5 45.5 45 47 46.5 49 L 48.5 51.5 L 71 51.5 C 73 51.5 74 52.8 74 54.8 L 74 76.5 C 74 80 71 82.5 67.5 82.5 L 32.5 82.5 C 29 82.5 26 80 26 76.5 Z" fill="url(#cvFolderGrad)" />
  </g>

  <!-- Folder Top Highlight / Sheen -->
  <path d="M 29.5 46.2 L 41.5 46.2 C 43.2 46.2 44.5 47.4 45.8 49.3 L 47.8 51.8 C 48.3 52.4 49 52.8 49.8 52.8 L 71 52.8" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- "CV" Bold White Typography -->
  <g fill="#FFFFFF">
    <!-- C Letter -->
    <path d="M 48.2 62.8 C 47.2 59.2 44.2 56.8 40.2 56.8 C 34.8 56.8 30.5 61.2 30.5 67 C 30.5 72.8 34.8 77.2 40.2 77.2 C 44.2 77.2 47.2 74.8 48.2 71.2 L 43.8 71.2 C 43 72.8 41.8 73.7 40.2 73.7 C 36.8 73.7 34.3 70.8 34.3 67 C 34.3 63.2 36.8 60.3 40.2 60.3 C 41.8 60.3 43 61.2 43.8 62.8 Z" />

    <!-- V Letter -->
    <path d="M 49.8 57.3 L 53.8 57.3 L 58.8 71.8 L 63.8 57.3 L 67.8 57.3 L 60.8 76.7 L 56.8 76.7 Z" />
  </g>
</svg>
