# CI pipeline: run on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Only used by `prisma generate` (no real database is contacted).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The generated client is gitignored, so a fresh checkout needs it regenerated.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  frontend:
    name: Frontend · typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build-only check: catches Dockerfile regressions without running containers.
      - run: docker compose -f docker-compose.prod.yml build
