# CI pipeline: run on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · typecheck, lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Only used by `prisma generate` (the tests point at the service DB).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: placement
          POSTGRES_PASSWORD: placement
          POSTGRES_DB: placement_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U placement -d placement_portal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The generated client is gitignored, so a fresh checkout needs it regenerated.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Integration tests run against the Postgres service above.
      - run: npm test

  frontend:
    name: Frontend · typecheck, lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build-only check: catches Dockerfile regressions without running containers.
      - run: docker compose -f docker-compose.prod.yml build
