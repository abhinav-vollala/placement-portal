# Production stack: Postgres + API + Nginx-served frontend.
# Run: docker compose -f docker-compose.prod.yml up -d --build
#
# Optional overrides (root .env or shell):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   JWT_SECRET, JWT_EXPIRES_IN, CLIENT_URL
#
# IMPORTANT: override JWT_SECRET with a long random string for any real deployment.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placement}
      POSTGRES_DB: ${POSTGRES_DB:-placement_portal}
    volumes:
      - placement_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-placement} -d ${POSTGRES_DB:-placement_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-placement}:${POSTGRES_PASSWORD:-placement}@db:5432/${POSTGRES_DB:-placement_portal}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      db:
        condition: service_healthy
    # Apply schema migrations, then start the API.
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  placement_db_data:
