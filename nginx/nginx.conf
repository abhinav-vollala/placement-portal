# Nginx config for the Placement Portal (production).
# Serves the built React app and proxies API calls to the backend service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets can be cached (hashed filenames from vite build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown routes are client-side routes, serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend container.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
